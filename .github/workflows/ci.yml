name: EELMS CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eelms_test_db
          POSTGRES_USER: eelms_user
          POSTGRES_PASSWORD: eelms_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements/development.txt

    - name: Run Django System Checks
      env:
        USE_POSTGRES: "True"
        DATABASE_NAME: eelms_test_db
        DATABASE_USER: eelms_user
        DATABASE_PASSWORD: eelms_password
        DATABASE_HOST: localhost
        DATABASE_PORT: 5432
      run: |
        python backend/manage.py check

    - name: Run Pytest Suite
      env:
        USE_POSTGRES: "True"
        DATABASE_NAME: eelms_test_db
        DATABASE_USER: eelms_user
        DATABASE_PASSWORD: eelms_password
        DATABASE_HOST: localhost
        DATABASE_PORT: 5432
      run: |
        pytest backend/tests/
