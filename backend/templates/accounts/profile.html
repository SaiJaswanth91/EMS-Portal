{% extends 'base.html' %}

{% block title %}User Profile | EELMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card card-stat p-4 mb-4">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="stat-icon bg-primary text-white fs-2" style="width: 64px; height: 64px; border-radius: 50%;">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div>
                    <h3 class="fw-bold mb-1">{{ user.get_full_name }}</h3>
                    <p class="text-muted mb-1">{{ user.email }}</p>
                    <span class="badge badge-role-{{ user.role|lower }} text-uppercase">{{ user.role }}</span>
                </div>
            </div>

            <hr class="my-4">

            <h5 class="fw-bold mb-3"><i class="bi bi-pencil-square text-primary me-2"></i>Update Personal Information</h5>
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">First Name</label>
                        {{ form.first_name }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Last Name</label>
                        {{ form.last_name }}
                    </div>
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-primary px-4 fw-bold">
                            <i class="bi bi-save me-2"></i> Save Changes
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
