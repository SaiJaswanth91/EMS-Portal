{% extends 'base.html' %}

{% block title %}Password Reset Complete | EELMS Enterprise{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4" style="min-height: 75vh;">
    <div class="col-11 col-sm-9 col-md-7 col-lg-5 col-xl-4 text-center">
        <div class="card shadow-lg border-0 rounded-4 p-4 p-sm-5">
            <div class="mb-3">
                <i class="bi bi-shield-check text-success display-2"></i>
            </div>
            <h4 class="fw-bold mb-2">Password Reset Complete</h4>
            <p class="text-muted fs-7 mb-4">
                Your password has been set. You may now log in with your new password.
            </p>
            <a href="{% url 'login' %}" class="btn btn-primary btn-lg rounded-3 fw-bold">Log In Now</a>
        </div>
    </div>
</div>
{% endblock %}
